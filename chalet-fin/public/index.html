<script>
const HIST={"rev": [2733980, 593360, 4164870, 5933405, 5241200, 6471219, 12131424, 15276361, 4047697, 18961505], "cogs": [1935444, 263644, 1837289, 2343673, 2544251, 3334761, 7093311, 8738434, 2187364, 11010596], "bon": [44433, 11131, 0, 0, 0, 0, 2410854, 1349571, 544578, 2310295], "kom": [22591, 30364, 22083, 16354, 0, 288601, 90191, 72998, 86073, 138026], "des": [0, 0, 71985, 412300, 0, 306383, 0, 0, 0, 246118], "tax": [0, 0, 0, 0, 0, 194137, 363943, 458291, 121431, 568845], "Аренда": [1313700, 1313700, 1313700, 1313700, 1313700, 1391239, 1415104, 1413529, 1412161, 1313700], "Зарплата (оклады)": [1257432, 1167849, 985091, 1099517, 1215962, 1453648, 1261863, 1081221, 1090892, 1056346], "Налоги ЗП": [331755, 129688, 108361, 138128, 133757, 374183, 317449, 268171, 270176, 257296], "Налоги ИП": [21675, 21675, 21675, 21675, 21675, 21675, 21675, 21675, 21675, 21675], "СММ": [270000, 270000, 270000, 270000, 270000, 270000, 270000, 270000, 270000, 270000], "Маркетинг": [0, 0, 0, 0, 0, 0, 284500, 747800, 234765, 236305], "Логистика": [44000, 59095, 0, 0, 90000, 135000, 190000, 312670, 35000, 427950], "Услуги 1С": [26200, 26200, 26200, 26200, 13100, 13100, 13100, 13100, 13100, 13100], "Клининг": [40000, 50000, 50000, 50000, 50000, 50000, 50000, 50000, 50000, 50000], "Связь": [1150, 1150, 1150, 1150, 1150, 1150, 965, 1150, 1150, 1150], "Ремонт и представительские": [0, 0, 0, 0, 0, 0, 0, 0, 114486, 497817], "Прочие": [0, 0, 239000, 0, 22500, 39000, 68030, 20000, 157000, 80765]};
const API='/api/fin';
const ROLE_NAME={manager:'Менеджер',accountant:'Бухгалтер',rop:'РОП',director:'Директор',owner:'Учредитель',admin:'Администратор'};
const TABS={manager:['sales'],accountant:['expenses','sales','month'],rop:['week','sales'],director:['today','managers','week','sales','expenses','month'],owner:['today','managers','month','model','week'],admin:['today','managers','sales','expenses','week','month','model','settings']};

const CATS=['Аренда','Зарплата (оклады)','Налоги ЗП','Налоги ИП','СММ','Маркетинг','Логистика','Услуги 1С','Клининг','Связь','Ремонт и представительские','Прочие'];
const DEF={markup:2.5,kaspi:0.125,card:0.01,designer:0.10,tax:0.03,plan:3000000,
 budget:{'Аренда':1313700,'Зарплата (оклады)':777375,'Налоги ЗП':257296,'Налоги ИП':21675,'СММ':270000,'Маркетинг':236305,'Услуги 1С':13100,'Клининг':50000,'Связь':1150},
 fixedCats:['Аренда','Зарплата (оклады)','Налоги ЗП','Налоги ИП','СММ','Маркетинг','Услуги 1С','Клининг','Связь'],
 model:{discount:0.15,bonus:0.08,comm:0.03,des:0.01}};
let PIN=localStorage.getItem('fin_pin')||'',ROLE='',DB=null,TAB='',MON=ym(new Date());
const $=id=>document.getElementById(id);
const fmt=n=>(Math.round(n||0)).toLocaleString('ru-RU').replace(/,/g,' ')+' ₸';
const fmtS=n=>{const r=Math.round(n||0);return (r<0?'− ':r>0?'+ ':'')+Math.abs(r).toLocaleString('ru-RU')+' ₸'};
const pct=n=>((n||0)*100).toFixed(1).replace('.',',')+'%';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ym(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function S(){const s=Object.assign({},DEF,DB&&DB.settings||{});s.budget=Object.assign({},DEF.budget,(DB&&DB.settings&&DB.settings.budget)||{});s.model=Object.assign({},DEF.model,(DB&&DB.settings&&DB.settings.model)||{});return s}
async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pin:PIN},body))});const j=await r.json().catch(()=>({error:'Сервер не отвечает'}));if(!r.ok||j.error)throw new Error(j.error||'Ошибка');DB=j.db;ROLE=j.role;return j}
// ---- расчёт продажи
function calc(x){const s=S();const price=+x.price||0,disc=(+x.disc||0)/100;const cash=price*(1-disc);const cogs=price/s.markup;const pay=x.pay||'Безнал';const comm=cash*(/^Kaspi/.test(pay)?s.kaspi:(pay==='Наличные'?0:s.card));const des=x.designer==='Да'?cash*s.designer:0;const bonus=+x.bonus||0;const tax=cash*s.tax;return{cash,cogs,comm,des,bonus,tax,profit:cash-cogs-comm-des-bonus-tax}}
const counted=x=>x.status==='Продано'||x.status==='Исполнено';
function sumSales(from,to){const t={n:0,cash:0,cogs:0,comm:0,des:0,bonus:0,tax:0};(DB.sales||[]).forEach(x=>{if(!counted(x)||!x.date||x.date<from||x.date>to)return;const c=calc(x);t.n++;for(const k of['cash','cogs','comm','des','bonus','tax'])t[k]+=c[k]});t.md=t.cash-t.cogs-t.comm-t.des-t.bonus-t.tax;return t}
function sumExp(from,to,filter){return(DB.expenses||[]).filter(x=>x.date>=from&&x.date<=to&&(!filter||filter(x))).reduce((a,x)=>a+(+x.amount||0),0)}
function fixedTotal(){const s=S();return s.fixedCats.reduce((a,c)=>a+(+s.budget[c]||0),0)}
// ---- месяц ОПУ
function monthPL(m){const [y,mm]=m.split('-').map(Number);const r={};if(y===2026&&mm<=10){const i=mm-1;r.rev=HIST.rev[i];r.cogs=HIST.cogs[i];r.bon=HIST.bon[i];r.kom=HIST.kom[i];r.des=HIST.des[i];r.tax=HIST.tax[i];CATS.forEach(c=>r[c]=HIST[c][i]);r.src='факт из ОПиУ'}else{const from=m+'-01',to=m+'-31';const t=sumSales(from,to);r.rev=t.cash;r.cogs=t.cogs;r.bon=t.bonus;r.kom=t.comm;r.des=t.des;r.tax=t.tax;CATS.forEach(c=>r[c]=sumExp(from,to,x=>x.cat===c));r.src='авто'}
 r.gm=r.rev-r.cogs;r.exp=r.bon+r.kom+r.des+r.tax+CATS.reduce((a,c)=>a+(r[c]||0),0);r.np=r.gm-r.exp;return r}
// ---- экраны
const V={};
function prevMonthRange(now){const p=new Date(now.getFullYear(),now.getMonth()-1,1);const pdim=new Date(p.getFullYear(),p.getMonth()+1,0).getDate();const day=Math.min(now.getDate(),pdim);return{m:ym(p),from:ym(p)+'-01',to:ym(p)+'-'+String(day).padStart(2,'0'),day,dim:pdim}}
function mtd(m,from,to,day,dim){const s=S();const t=sumSales(from,to);const hasDaily=(DB.sales||[]).some(x=>(x.date||'').startsWith(m)&&counted(x));if(!hasDaily&&m<='2026-10'){const r=monthPL(m),k=day/dim;return{est:true,n:null,cash:r.rev*k,bonus:r.bon*k,md:(r.rev-r.cogs-r.bon-r.kom-r.des-r.tax)*k,fixed:CATS.reduce((a,c)=>a+(r[c]||0),0)*k,once:0,np:r.np*k}}
 const fixed=fixedTotal()*day/dim;const once=sumExp(from,to,x=>!s.fixedCats.includes(x.cat));return Object.assign(t,{fixed,once,np:t.md-fixed-once})}
function delta(a,b,money=true){if(b===null||b===undefined)return'';const d=a-b;const p=b?d/Math.abs(b):null;const up=d>=0;return `<span class="${up?'pos':'neg'}" style="font-size:13px;font-weight:700">${up?'▲':'▼'} ${money?fmt(Math.abs(d)):Math.abs(Math.round(d))}${p!==null?' ('+(up?'+':'−')+Math.abs(p*100).toFixed(0)+'%)':''}</span>`}
V.today=()=>{const s=S(),now=new Date(),m=ym(now),from=m+'-01',to=iso(now);const dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),day=now.getDate();const t=mtd(m,from,to,day,dim);const pr=prevMonthRange(now);const p=mtd(pr.m,pr.from,pr.to,pr.day,pr.dim);
 const cm=t.cash?t.md/t.cash:null;const fRev=t.cash/day*dim;const fNp=t.md/day*dim-fixedTotal()-t.once;const left=Math.max(1,dim-day);const need=cm?Math.max(0,(s.plan+fixedTotal()+t.once-t.md)/cm/left):null;
 const lw=lastWeek();const w=DB.weeks[lw.key]||{};const wOk=w.rop&&w.rop.ok==='Да'&&w.dir&&w.dir.ok==='Да';
 const pm=new Date(pr.from).toLocaleString('ru-RU',{month:'long'});
 const days=[];for(let d=1;d<=day;d++){const ds=m+'-'+String(d).padStart(2,'0');days.push(sumSales(ds,ds).cash)}const mx=Math.max(1,...days);
 const mg=byManager(from,to);
 return `${!wOk?`<div class="alert">Неделя ${lw.label} не подтверждена${w.rop&&w.rop.ok==='Да'?' директором':w.dir&&w.dir.ok==='Да'?' РОП':' РОП и директором'}</div>`:''}
 <div class="hero ${t.np>=0?'p':'n'}"><div class="l">Чистая прибыль компании с 1 по ${day} ${now.toLocaleString('ru-RU',{month:'long'})}</div><div class="big">${fmtS(t.np)}</div><div class="l">${t.np>=0?'В ПЛЮСЕ':'В МИНУСЕ'} · прошлый месяц на эту дату: ${fmtS(p.np)}${p.est?'*':''}</div></div>
 <div class="card"><div style="font-weight:700;margin-bottom:6px">С начала месяца · сравнение с прошлым месяцем (${pm}) на ${pr.day} число</div>
 <div class="kv"><span>Выручка в кассу</span><b>${fmt(t.cash)}<br>${delta(t.cash,p.cash)}</b></div>
 <div class="kv"><span>Продаж</span><b>${t.n}${p.n!==null?'<br>'+delta(t.n,p.n,false):''}</b></div>
 <div class="kv"><span>Средний чек</span><b>${fmt(t.n?t.cash/t.n:0)}</b></div>
 <div class="kv"><span>Бонусы менеджерам</span><b>${fmt(t.bonus)}<br>${delta(t.bonus,p.bonus)}</b></div>
 <div class="kv"><span>Маржинальный доход</span><b>${fmt(t.md)}<br>${delta(t.md,p.md)}</b></div>
 <div class="kv"><span>Постоянные расходы за ${day} дн.</span><b>${fmt(t.fixed)}</b></div><div class="kv"><span>Разовые расходы</span><b>${fmt(t.once)}</b></div>
 <div class="kv"><span>Чистая прибыль</span><b class="${t.np>=0?'pos':'neg'}">${fmtS(t.np)}<br>${delta(t.np,p.np)}</b></div>
 ${p.est?`<div class="note">* ${pm}: продаж по дням нет, сравнение по месячному итогу ОПиУ пропорционально дням.</div>`:''}</div>
 <div class="card"><div style="font-weight:700;margin-bottom:8px">Выручка по дням</div><div style="display:flex;align-items:flex-end;gap:3px;height:110px">${days.map((v,i)=>`<div title="${i+1}: ${fmt(v)}" style="flex:1;background:${i===day-1?'var(--acc)':'#b9cfc6'};height:${Math.max(2,v/mx*100)}%;border-radius:3px 3px 0 0"></div>`).join('')}</div><div class="note" style="display:flex;justify-content:space-between"><span>1</span><span>${day}</span></div></div>
 <div class="card"><div style="font-weight:700;margin-bottom:6px">Менеджеры за месяц</div>${mg.length?mg.map((x,i)=>`<div class="kv"><span>${i===0?'🏆 ':''}${esc(x.name)} · ${x.n} прод.</span><b>${fmt(x.cash)}<br><span class="note">бонус ${fmt(x.bonus)}</span></b></div>`).join(''):'<div class="note">Продаж пока нет</div>'}</div>
 <div class="card"><div class="kv"><span>Прогноз выручки за месяц</span><b>${fmt(fRev)}</b></div><div class="kv"><span>Прогноз прибыли за месяц</span><b class="${fNp>=0?'pos':'neg'}">${fmtS(fNp)}</b></div><div class="kv"><span>План прибыли</span><b>${fmt(s.plan)}</b></div><div class="kv"><span>Нужно продавать в день до конца месяца</span><b>${need===null?'нет продаж':fmt(need)}</b></div></div>
 <div class="note">Постоянные расходы считаются по бюджету за прошедшие дни, точный итог — в «ОПУ» после закрытия месяца.</div>`};
function byManager(from,to){const g={};(DB.sales||[]).forEach(x=>{if(!counted(x)||!x.date||x.date<from||x.date>to)return;const k=(x.manager||'Без имени').trim();const c=calc(x);g[k]=g[k]||{name:k,n:0,cash:0,bonus:0,profit:0};g[k].n++;g[k].cash+=c.cash;g[k].bonus+=c.bonus;g[k].profit+=c.profit});return Object.values(g).sort((a,b)=>b.cash-a.cash)}
V.managers=()=>{const now=new Date();const [y,mm]=MON.split('-').map(Number);const dim=new Date(y,mm,0).getDate();const cur=MON===ym(now);const lastDay=cur?now.getDate():dim;const from=MON+'-01',to=MON+'-'+String(lastDay).padStart(2,'0');const pd=new Date(y,mm-2,1);const pm=ym(pd);const pdim=new Date(pd.getFullYear(),pd.getMonth()+1,0).getDate();const pto=pm+'-'+String(Math.min(lastDay,pdim)).padStart(2,'0');

 return `<div class="card"><b>Новая продажа</b>
 <div class="row"><div><label>Дата</label><input type="date" id="sD" value="${iso(new Date())}"></div><div><label>Менеджер</label><input id="sM" value="${esc(localStorage.getItem('fin_mgr')||'')}"></div></div>
 <label>Клиент / № чека</label><input id="sC">
 <div class="row"><div><label>Сумма по прайсу, ₸</label><input id="sP" inputmode="numeric"></div><div><label>Скидка, %</label><input id="sDi" inputmode="decimal" value="0"></div></div>
 <div class="row"><div><label>Оплата</label><select id="sPay"><option>Безнал</option><option>Наличные</option><option>Kaspi кредит</option><option>Kaspi рассрочка</option></select></div><div><label>Через дизайнера</label><select id="sDes"><option>Нет</option><option>Да</option></select></div></div>
 <div class="row"><div><label>Статус</label><select id="sSt"><option>Продано</option><option>В работе</option><option>Исполнено</option><option>Отменено</option></select></div><div><label>Бонус менеджеру, ₸</label><input id="sB" inputmode="numeric" value="0"></div></div>
 <div class="note" id="sPrev" style="margin-top:8px"></div><button class="btn" id="sSave">Записать продажу</button><input type="hidden" id="sId"></div>
 ${monthPicker()}<div class="card"><div class="kv"><span>Продано и исполнено</span><b>${t.n} · ${fmt(t.cash)}</b></div><div class="kv"><span>Прибыль сделок до постоянных</span><b>${fmt(t.md)}</b></div></div>
 <div class="card list">${list.length?list.map(x=>{const c=calc(x);return `<div class="it"><div class="t"><span>${esc(x.client||'—')}</span><span>${fmt(c.cash)}</span></div><div class="m">${esc(x.date)} · ${esc(x.manager||'')} · скидка ${esc(x.disc||0)}% · ${esc(x.pay||'')} · <span class="chip ${counted(x)?'ok':x.status==='Отменено'?'w':''}">${esc(x.status)}</span> · бонус ${fmt(x.bonus)}</div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm g" data-edit="${x.id}">Изменить</button><button class="btn sm g" data-del="${x.id}">Удалить</button></div></div>`}).join(''):'<div class="note">Продаж за месяц нет</div>'}</div>`};
V.expenses=()=>{const s=S();const list=(DB.expenses||[]).filter(x=>(x.date||'').startsWith(MON)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const tot=list.reduce((a,x)=>a+(+x.amount||0),0);
 return `<div class="card"><b>Новый расход</b><div class="row"><div><label>Дата</label><input type="date" id="eD" value="${iso(new Date())}"></div><div><label>Сумма, ₸</label><input id="eA" inputmode="numeric"></div></div>
 <label>Статья</label><select id="eC">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
 <div class="row"><div><label>Как оплачено</label><select id="eP"><option>Безнал</option><option>Наличные</option><option>Kaspi</option></select></div><div><label>Комментарий</label><input id="eN"></div></div>
 <div class="note" style="margin-top:8px">Себестоимость, бонусы менеджерам, комиссии и дизайнер сюда не вносятся: они считаются из продаж.</div><button class="btn" id="eSave">Записать расход</button><input type="hidden" id="eId"></div>
 ${monthPicker()}<div class="card"><div class="kv"><span>Расходов за месяц</span><b>${fmt(tot)}</b></div>${CATS.map(c=>{const v=list.filter(x=>x.cat===c).reduce((a,x)=>a+(+x.amount||0),0);return v?`<div class="kv"><span>${c}${s.fixedCats.includes(c)?` <span class="note">бюджет ${fmt(s.budget[c])}</span>`:''}</span><b>${fmt(v)}</b></div>`:''}).join('')}</div>
 <div class="card list">${list.length?list.map(x=>`<div class="it"><div class="t"><span>${esc(x.cat)}</span><span>${fmt(x.amount)}</span></div><div class="m">${esc(x.date)} · ${esc(x.pay||'')} · ${esc(x.note||'')}</div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn sm g" data-eedit="${x.id}">Изменить</button><button class="btn sm g" data-edel="${x.id}">Удалить</button></div></div>`).join(''):'<div class="note">Расходов за месяц нет</div>'}</div>`};
V.week=()=>{const weeks=[];const d=new Date();const wd=(d.getDay()+6)%7;for(let k=0;k<10;k++){const mon=new Date(d);mon.setDate(d.getDate()-wd-7*k);const sun=new Date(mon);sun.setDate(mon.getDate()+6);weeks.push({key:iso(mon),from:iso(mon),to:iso(sun),cur:k===0})}
 const canR=ROLE==='rop'||ROLE==='admin',canD=ROLE==='director'||ROLE==='admin';
 return `<div class="sub">Каждый понедельник РОП и директор сверяют прошлую неделю с кассой и банком и подтверждают цифры.</div>`+weeks.map(w=>{const t=sumSales(w.from,w.to);const c=DB.weeks[w.key]||{};const st=(c.rop&&c.rop.ok==='Да'&&c.dir&&c.dir.ok==='Да')?'<span class="chip ok">Подтверждено</span>':w.cur?'<span class="chip">Идёт неделя</span>':'<span class="chip w">Ждёт подтверждения</span>';
 const side=(k,nm,can)=>{const v=c[k];return `<div class="kv"><span>${nm}</span><b>${v?`${v.ok==='Да'?'✓ Да':'✗ '+esc(v.ok)} · ${esc(v.name)}`:'—'}</b></div>${v&&v.note?`<div class="note">${esc(v.note)}</div>`:''}${can&&!w.cur?`<div class="row" style="margin-top:6px"><button class="btn sm" data-wok="${w.key}|${k}">Подтверждаю</button><button class="btn sm g" data-wno="${w.key}|${k}">Есть вопросы</button></div>`:''}`};
 return `<div class="card"><div class="t" style="display:flex;justify-content:space-between;font-weight:700"><span>${new Date(w.from).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})} – ${new Date(w.to).toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}</span>${st}</div>
 <div class="kv"><span>Продаж</span><b>${t.n}</b></div><div class="kv"><span>Выручка в кассу</span><b>${fmt(t.cash)}</b></div><div class="kv"><span>Валовая маржа</span><b>${fmt(t.cash-t.cogs)}</b></div><div class="kv"><span>Бонусы</span><b>${fmt(t.bonus)}</b></div>${side('rop','РОП',canR)}${side('dir','Директор',canD)}</div>`}).join('')};
V.month=()=>{const rows=[['Выручка','rev'],['Себестоимость','cogs'],['Валовая маржа','gm'],['Бонусы','bon'],['Комиссии банка, Kaspi','kom'],['Дизайнеру','des'],['Налог 3%','tax']].concat(CATS.map(c=>[c,c])).concat([['Итого расходы','exp'],['Чистая прибыль','np']]);
 const ms=[];for(let m=1;m<=12;m++)ms.push('2026-'+String(m).padStart(2,'0'));const now=new Date();if(now.getFullYear()>2026)for(let m=1;m<=now.getMonth()+1;m++)ms.push(now.getFullYear()+'-'+String(m).padStart(2,'0'));
 const P=ms.map(monthPL);const s=S();const sum=k=>P.reduce((a,r)=>a+(r[k]||0),0);
 return `<div class="sub">Январь–октябрь 2026 — факт из ОПиУ, дальше считается само из продаж и расходов.</div><div class="card scroll"><table><tr><th>Статья</th>${ms.map(m=>`<th>${new Date(m+'-01').toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})}</th>`).join('')}<th>Итого</th></tr>
 ${rows.map(([n,k])=>`<tr class="${k==='np'||k==='gm'?'tot':''}"><td>${n}</td>${P.map(r=>`<td class="${k==='np'?(r.np<0?'neg':'pos'):''}">${Math.round(r[k]||0).toLocaleString('ru-RU')}</td>`).join('')}<td>${Math.round(sum(k)).toLocaleString('ru-RU')}</td></tr>`).join('')}
 <tr><td>Рентабельность</td>${P.map(r=>`<td>${r.rev?pct(r.np/r.rev):'—'}</td>`).join('')}<td>${pct(sum('np')/(sum('rev')||1))}</td></tr></table></div>
 <div class="note">В исходном файле ОПиУ в январе–феврале зарплата посчитана дважды, а в июне–октябре не учтены налоги с зарплаты и налог ИП. Здесь пересчитано по статьям, налог 3% включён в расходы.</div>`};
V.model=()=>{const s=S(),m=s.model;const P=['2026-07','2026-08','2026-09','2026-10'].map(monthPL);const R=P.reduce((a,r)=>a+r.rev,0);const f={cogs:P.reduce((a,r)=>a+r.cogs,0)/R,bon:P.reduce((a,r)=>a+r.bon,0)/R,kom:P.reduce((a,r)=>a+r.kom,0)/R,des:P.reduce((a,r)=>a+r.des,0)/R};f.cm=1-f.cogs-f.bon-f.kom-f.des-s.tax;f.fixed=P.reduce((a,r)=>a+CATS.reduce((b,c)=>b+(r[c]||0),0),0)/4;f.disc=1-1/(s.markup*f.cogs);
 const p={cogs:1/(s.markup*(1-m.discount)),bon:m.bonus,kom:m.comm,des:m.des};p.cm=1-p.cogs-p.bon-p.kom-p.des-s.tax;p.fixed=fixedTotal();
 const line=(n,a,b,fm)=>`<tr><td>${n}</td><td>${fm(a)}</td><td>${fm(b)}</td></tr>`;const F=x=>fmt(x).replace(' ₸','');
 const ed=ROLE==='admin'||ROLE==='owner';
 return `<div class="card scroll"><table><tr><th>Показатель</th><th>Факт июль–окт</th><th>План</th></tr>
 ${line('Средняя скидка',f.disc,m.discount,pct)}${line('Себестоимость, % выручки',f.cogs,p.cogs,pct)}${line('Бонусы, % выручки',f.bon,p.bon,pct)}${line('Комиссии, % выручки',f.kom,p.kom,pct)}${line('Дизайнеру, % выручки',f.des,p.des,pct)}${line('Маржинальный доход, %',f.cm,p.cm,pct)}${line('Постоянные расходы в месяц, ₸',f.fixed,p.fixed,F)}
 <tr class="tot">${'<td>Точка безубыточности, ₸</td>'}<td>${F(f.fixed/f.cm)}</td><td>${F(p.fixed/p.cm)}</td></tr><tr class="tot"><td>Выручка для ${F(s.plan)} ₸ прибыли</td><td>${F((f.fixed+s.plan)/f.cm)}</td><td>${F((p.fixed+s.plan)/p.cm)}</td></tr></table></div>
 ${ed?`<div class="card"><b>План (можно менять)</b><div class="row"><div><label>Средняя скидка, %</label><input id="mD" inputmode="decimal" value="${(m.discount*100).toFixed(0)}"></div><div><label>Бонусы, % выручки</label><input id="mB" inputmode="decimal" value="${(m.bonus*100).toFixed(0)}"></div></div><div class="row"><div><label>Комиссии, %</label><input id="mC" inputmode="decimal" value="${(m.comm*100).toFixed(1)}"></div><div><label>Дизайнеру, %</label><input id="mDe" inputmode="decimal" value="${(m.des*100).toFixed(1)}"></div></div><button class="btn" id="mSave">Пересчитать</button></div>`:''}
 <div class="card"><b>Сценарии по выручке (план)</b>${[5,7.5,10,15,20,25].map(v=>{const r=v*1e6,np=r*p.cm-p.fixed;return `<div class="kv"><span>${v} млн ₸</span><b class="${np<0?'neg':'pos'}">${fmtS(np)}</b></div>`}).join('')}</div>
 <div class="card"><b>Скидка и прибыль при выручке 15 млн ₸</b>${[0,10,15,20,25,30].map(d=>{const c=1/(s.markup*(1-d/100));const np=15e6*(1-c-p.bon-p.kom-p.des-s.tax)-p.fixed;return `<div class="kv"><span>скидка ${d}%</span><b class="${np<0?'neg':'pos'}">${fmtS(np)}</b></div>`}).join('')}</div>`};
V.settings=()=>{const s=S();return `<div class="card"><b>Параметры</b><div class="row"><div><label>Наценка (маркап)</label><input id="xM" value="${s.markup}"></div><div><label>Kaspi кредит, %</label><input id="xK" value="${s.kaspi*100}"></div></div><div class="row"><div><label>Безнал, %</label><input id="xC" value="${s.card*100}"></div><div><label>Дизайнер, %</label><input id="xDe" value="${s.designer*100}"></div></div><div class="row"><div><label>Налог, %</label><input id="xT" value="${s.tax*100}"></div><div><label>План прибыли, ₸</label><input id="xP" value="${s.plan}"></div></div></div>
 <div class="card"><b>Бюджет постоянных расходов в месяц</b>${s.fixedCats.map(c=>`<label>${c}</label><input data-bud="${c}" inputmode="numeric" value="${s.budget[c]||0}">`).join('')}<div class="kv" style="margin-top:10px"><span>Итого</span><b>${fmt(fixedTotal())}</b></div><button class="btn" id="xSave">Сохранить</button></div>
 <div class="card"><b>Коды доступа</b><div class="note">Менеджеры 2817 · Бухгалтер 4731 · РОП 5926 · Директор 6184 · Учредитель 7350 · Администратор 9042</div></div>`};
function render(){const tabs=TABS[ROLE]||[];if(!tabs.includes(TAB))TAB=tabs[0];$('side').innerHTML=tabs.map(t=>`<button class="${t===TAB?'on':''}" data-t="${t}"><span class="i">${TAB_ICON[t]}</span>${TAB_NAME[t]}</button>`).join('');$('side').style.display=tabs.length>1?'':'none';$('who').textContent=ROLE_NAME[ROLE]+' · '+new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});$('view').innerHTML=V[TAB]();bind()}
function bind(){const mi=$('monI');if(mi)mi.onchange=()=>{MON=mi.value;render()};
 const prev=()=>{const p=$('sPrev');if(!p)return;const c=calc({price:$('sP').value.replace(/\s/g,''),disc:$('sDi').value,pay:$('sPay').value,designer:$('sDes').value,bonus:$('sB').value.replace(/\s/g,'')});p.innerHTML=c.cash?`В кассу ${fmt(c.cash)} · прибыль сделки ${fmtS(c.profit)} (${pct(c.profit/c.cash)})`:''};
 ['sP','sDi','sPay','sDes','sB'].forEach(i=>{const e=$(i);if(e)e.oninput=e.onchange=prev});
 const ss=$('sSave');if(ss)ss.onclick=async()=>{const it={id:$('sId').value,date:$('sD').value,manager:$('sM').value.trim(),client:$('sC').value.trim(),price:+$('sP').value.replace(/\s/g,''),disc:+String($('sDi').value).replace(',','.')||0,pay:$('sPay').value,designer:$('sDes').value,status:$('sSt').value,bonus:+$('sB').value.replace(/\s/g,'')||0};if(!it.price||!it.date){alert('Укажите дату и сумму');return}localStorage.setItem('fin_mgr',it.manager);await save('sale',it)};
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=DB.sales.find(s=>s.id===b.dataset.edit);$('sId').value=x.id;$('sD').value=x.date;$('sM').value=x.manager||'';$('sC').value=x.client||'';$('sP').value=x.price;$('sDi').value=x.disc;$('sPay').value=x.pay;$('sDes').value=x.designer;$('sSt').value=x.status;$('sB').value=x.bonus||0;$('sSave').textContent='Сохранить изменения';window.scrollTo(0,0);prev()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить продажу?'))await del('sale',b.dataset.del)});
 const es=$('eSave');if(es)es.onclick=async()=>{const it={id:$('eId').value,date:$('eD').value,amount:+$('eA').value.replace(/\s/g,''),cat:$('eC').value,pay:$('eP').value,note:$('eN').value.trim()};if(!it.amount||!it.date){alert('Укажите дату и сумму');return}await save('expense',it)};
 document.querySelectorAll('[data-eedit]').forEach(b=>b.onclick=()=>{const x=DB.expenses.find(s=>s.id===b.dataset.eedit);$('eId').value=x.id;$('eD').value=x.date;$('eA').value=x.amount;$('eC').value=x.cat;$('eP').value=x.pay;$('eN').value=x.note||'';$('eSave').textContent='Сохранить изменения';window.scrollTo(0,0)});
 document.querySelectorAll('[data-edel]').forEach(b=>b.onclick=async()=>{if(confirm('Удалить расход?'))await del('expense',b.dataset.edel)});
 document.querySelectorAll('[data-wok],[data-wno]').forEach(b=>b.onclick=async()=>{const [wk,side]=(b.dataset.wok||b.dataset.wno).split('|');const ok=b.dataset.wok?'Да':'Есть вопросы';const name=prompt('Ваше имя',localStorage.getItem('fin_name')||'');if(!name)return;localStorage.setItem('fin_name',name);const note=ok==='Да'?'':(prompt('Что не сходится?')||'');const d=new Date(wk);const to=new Date(d);to.setDate(d.getDate()+6);await save('week',{week:wk,side,ok,name,note,snap:sumSales(wk,iso(to))})});
 const ms=$('mSave');if(ms)ms.onclick=async()=>{const s=S();s.model={discount:(+$('mD').value.replace(',','.')||0)/100,bonus:(+$('mB').value.replace(',','.')||0)/100,comm:(+$('mC').value.replace(',','.')||0)/100,des:(+$('mDe').value.replace(',','.')||0)/100};await save('settings',s)};
 const xs=$('xSave');if(xs)xs.onclick=async()=>{const s=S();const n=id=>+String($(id).value).replace(',','.').replace(/\s/g,'');s.markup=n('xM');s.kaspi=n('xK')/100;s.card=n('xC')/100;s.designer=n('xDe')/100;s.tax=n('xT')/100;s.plan=n('xP');document.querySelectorAll('[data-bud]').forEach(i=>s.budget[i.dataset.bud]=+i.value.replace(/\s/g,'')||0);await save('settings',s)};}
async function save(type,item){try{await call({a:'save',type,item});render()}catch(e){alert(e.message)}}
async function del(type,id){try{await call({a:'del',type,item:{id}});render()}catch(e){alert(e.message)}}
$('side').onclick=e=>{const b=e.target.closest('[data-t]');if(b){TAB=b.dataset.t;render();window.scrollTo(0,0)}};
async function login(p){PIN=p;try{await call({a:'load'});localStorage.setItem('fin_pin',p);$('login').classList.add('hide');$('app').classList.remove('hide');render()}catch(e){$('pinE').textContent=e.message;localStorage.removeItem('fin_pin')}}
$('pinB').onclick=()=>login($('pinI').value.trim());$('pinI').onkeydown=e=>{if(e.key==='Enter')login($('pinI').value.trim())};
$('logout').onclick=e=>{e.preventDefault();localStorage.removeItem('fin_pin');location.reload()};
document.addEventListener('gesturestart',e=>e.preventDefault());
if(PIN)login(PIN);
setInterval(()=>{if(ROLE&&document.visibilityState==='visible'&&!document.activeElement.matches('input,select,textarea'))call({a:'load'}).then(render).catch(()=>{})},60000);
</script></body></html>
